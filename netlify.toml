[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect /api/* to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Single Page App SPA fallback for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
